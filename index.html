<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Булджать Awards 2026</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://odkhouddhfdyssxccsra.supabase.co" crossorigin>

    <link rel="preload" as="image" href="Banners/banner.jpg" fetchpriority="high">
    <!-- шрифты: Unbounded (заголовки) и Onest (текст), оба с кириллицей -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..900&family=Unbounded:wght@400..900&display=swap">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Основной текст: Onest. Системные шрифты остаются запасными, пока шрифт грузится */
        body { font-family: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        button { font-family: inherit; }

        /* Заголовки: Unbounded (он широкий, поэтому размеры меньше, а отрицательный letter-spacing убран) */
        .logo-block h1, .results-page-logo h1, .section-title h2, .category-name,
        .modal-content h2, .results-modal-title, .login-modal-content h2, .count-title,
        .footer-inner strong, #countdown, .count-box b {
            font-family: "Unbounded", "Onest", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            letter-spacing: 0;
        }

        .logo-block h1         { font-size: 22px; font-weight: 800; }
        .results-page-logo h1  { font-size: 26px; font-weight: 800; }
        .section-title h2      { font-size: 34px; font-weight: 800; }
        .category-name         { font-size: clamp(18px, 1.9vw, 26px); font-weight: 700; line-height: 1.22; }
        .modal-content h2,
        .results-modal-title   { font-size: 26px; font-weight: 800; }
        .login-modal-content h2 { font-size: 22px; font-weight: 800; }
        .count-title           { font-size: clamp(22px, 4vw, 36px); font-weight: 800; }
        .count-box b           { font-size: clamp(30px, 7vw, 64px); font-weight: 800; }
        #countdown             { font-size: 14px; font-weight: 700; }

        /* цифры номинаций с обводкой: у вариативного шрифта внутри цифр видны лишние линии, поэтому системный */
        .card-num .num { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif; }

        @media (max-width: 650px) {
            .logo-block h1         { font-size: 17px; }
            .results-page-logo h1  { font-size: 18px; }
            .section-title h2      { font-size: 22px; }
            .category-name         { font-size: 13px; }
            .modal-content h2,
            .results-modal-title   { font-size: 17px; }
            .login-modal-content h2 { font-size: 19px; }
            .count-title           { font-size: 22px; }
            .count-box b           { font-size: clamp(26px, 9vw, 40px); }
        }

        @media (max-width: 380px) {
            .category-name         { font-size: 12px; }
            .modal-content h2,
            .results-modal-title   { font-size: 15px; }
        }
    </style>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="config.js"></script>
    <script defer src="categories.js"></script>
    <script defer src="script.js"></script>
</head>

<body>

<div class="bg-fx" aria-hidden="true">
    <i class="beam b1"></i><i class="beam b2"></i>
    <i class="sh ring r1"></i><i class="sh ring r2"></i>
    <i class="sh dia d1"></i><i class="sh dia d2"></i>
    <i class="sh plus p1"></i>
    <i class="sh spark s1"></i><i class="sh spark s2"></i><i class="sh spark s3"></i>
</div>

<header class="header">
    <div class="header-inner">

        <div class="logo-block">
            <h1>Булджать Awards</h1>
            <span>Награды 2026 года</span>
        </div>

        <div class="header-right">
            <div class="countdown-block">
                <span class="countdown-label">До окончания голосования</span>
                <span id="countdown">Загрузка...</span>
            </div>

            <div class="account-wrapper">
                <button id="login-button" class="login-button" type="button">Авторизация</button>

                <div id="account-menu" class="account-menu">
                    <div class="account-menu-name" id="account-menu-name">Пользователь</div>
                    <button id="logout-button" class="logout-button" type="button">Выйти из аккаунта</button>
                </div>
            </div>
        </div>

    </div>
</header>

<main>

    <section class="top-image">
        <img src="Banners/banner.jpg" alt="Булджать Awards" decoding="async" fetchpriority="high">
    </section>

    <section class="nominations-section">
        <div class="section-title">
            <h2>Номинации</h2>
        </div>

        <div id="categories-grid" class="categories-grid"></div>
    </section>

</main>

<!-- Модалка номинации -->
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-overlay"></div>

    <div class="modal-content">
        <button id="close-modal" class="close-modal" type="button" aria-label="Закрыть">×</button>

        <div class="nomination-image">
            <img id="modal-image" src="Banners/banner.jpg" alt="" decoding="async">
        </div>

        <div class="modal-number" id="modal-number"></div>
        <h2 id="modal-title"></h2>
        <p id="modal-description" class="modal-description">Выберите одного кандидата.</p>

        <div id="nominees-list" class="nominees-list"></div>
        <div id="vote-message" class="vote-message" role="status" aria-live="polite"></div>

        <div class="modal-footer">
            <div class="nom-strip" id="nom-strip"></div>

            <div class="modal-navigation">
                <button id="prev-category" class="modal-nav-button" type="button">← Предыдущее</button>
                <span class="modal-counter" id="nav-counter"></span>
                <button id="next-category" class="modal-nav-button" type="button">Следующее →</button>
            </div>
        </div>
    </div>
</div>

<!-- Модалка авторизации -->
<div id="login-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <div class="modal-overlay"></div>

    <div class="login-modal-content">
        <button id="close-login-modal" class="close-modal" type="button" aria-label="Закрыть">×</button>

        <h2 id="login-title">Авторизация</h2>
        <p>Войдите через Google или Discord, чтобы голосовать.</p>

        <button id="google-login-modal" class="auth-provider-button google-auth-button" type="button">
            <span class="auth-provider-icon">G</span>
            <span>Войти через Google</span>
        </button>

        <button id="discord-login-modal" class="auth-provider-button discord-auth-button" type="button">
            <span class="auth-provider-icon">☁</span>
            <span>Войти через Discord</span>
        </button>
    </div>
</div>

<footer>
    <div class="footer-inner">
        <div>
            <strong>Булджать Awards 2026</strong>
            <p>Вы чувствуете влияние бисексуальных цветов на вас?</p>
        </div>

        <div class="footer-links">
            <a href="https://www.youtube.com/@buldjat" target="_blank" rel="noopener noreferrer">YouTube</a>
            <a href="https://discord.com/invite/buldzhat-reborn-756512042827120641" target="_blank" rel="noopener noreferrer">Discord</a>
            <a href="https://t.me/buldj" target="_blank" rel="noopener noreferrer">Telegram</a>
        </div>
    </div>
</footer>

</body>
</html>
