<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Булджать Awards 2026</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="header">
    <div class="header-inner">

        <div class="logo-block">
            <h1>Булджать Awards</h1>
            <span>Награды 2026 года</span>
        </div>

        <div class="header-right">
            <div class="countdown-block">
                <span class="countdown-label">До окончания голосования</span>
                <span id="countdown">Загрузка...</span>
            </div>

            <button id="login-button" class="login-button">
                Войти через Google
            </button>
        </div>

    </div>
</header>


<main>

    <!-- Большая картинка между хедером и номинациями -->
    <section class="top-image">
        <img
            src="./photo_2025-11-10_21-02-06.png"
            alt="Булджать Awards"
        >
    </section>


    <section class="nominations-section">

        <div class="section-title">
            <h2>Номинации</h2>
            <p>Выбирай своих фаворитов</p>
        </div>

        <div id="categories-grid" class="categories-grid"></div>

    </section>

</main>


<!-- Модальное окно номинации -->
<div id="modal" class="modal">

    <div class="modal-overlay"></div>

    <div class="modal-content">

        <button id="close-modal" class="close-modal">
            ×
        </button>

        <!-- Картинка конкретной номинации -->
        <div class="nomination-image">
            <img id="modal-image" src="" alt="">
        </div>

        <div class="modal-number" id="modal-number"></div>

        <h2 id="modal-title"></h2>

        <p id="modal-description" class="modal-description">
            Выберите одного кандидата.
        </p>

        <div id="nominees-list" class="nominees-list"></div>

        <div id="vote-message" class="vote-message"></div>

        <div class="modal-navigation">
    <button id="prev-category" class="modal-nav-button">
        ← Предыдущее
    </button>

    <button id="next-category" class="modal-nav-button">
        Следующее →
    </button>
    </div>

    </div>
</div>


<!-- Модальное окно входа -->
<div id="login-modal" class="modal">

    <div class="modal-overlay"></div>

    <div class="login-modal-content">

        <button id="close-login-modal" class="close-modal">
            ×
        </button>

        <h2>Вход необходим</h2>

        <p>
            Чтобы проголосовать, необходимо войти через Google.
        </p>

        <button id="google-login-modal" class="google-login-button">
            Войти через Google
        </button>

    </div>
</div>


<footer>
    <div class="footer-inner">

        <div>
            <strong>Булджать Awards 2026</strong>
            <p>Вы чувствуете как становитесь геями?</p>
        </div>

        <div class="footer-links">
            <a
                href="https://www.youtube.com/@buldjat"
                target="_blank"
            >
                YouTube
            </a>

            <a
                href="https://discord.com/invite/buldzhat-reborn-756512042827120641"
                target="_blank"
            >
                Discord
            </a>

            <a
                href="https://t.me/buldj"
                target="_blank"
            >
                Telegram
            </a>
        </div>

    </div>
</footer>


<script src="script.js"></script>

</body>
</html>
