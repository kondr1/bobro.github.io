<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>БУЛДЖАТЬ AWARDS 2026 — Результаты</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- =========================================================
         HEADER
    ========================================================== -->

    <header class="header results-page-header">
    <div class="header-inner">
        <div class="logo-block results-page-logo">
            <h1>БУЛДЖАТЬ AWARDS</h1>
            <span>Результаты голосования</span>
        </div>
    </div>
</header>


    <!-- =========================================================
         HERO
    ========================================================== -->

    <div class="top-image">

        <img
            src="./photo_2025-11-10_21-02-06.png"
            alt="БУЛДЖАТЬ AWARDS 2026"
        >

    </div>


    <!-- =========================================================
         RESULTS
    ========================================================== -->

    <main>

        <section class="nominations-section">

            <div class="section-title">

                <h2>
                    РЕЗУЛЬТАТЫ
                </h2>

                <p>
                    Нажмите на номинацию, чтобы посмотреть результаты
                </p>

                <div
                    class="results-update-status"
                    id="updateStatus"
                >
                    Загрузка результатов...
                </div>

            </div>


            <div
                class="results-error"
                id="errorMessage"
            ></div>


            <!--
                ВАЖНО:

                Используем ТОТ ЖЕ categories-grid,
                что и на главной странице.

                Поэтому ширина, количество колонок,
                расстояния и размеры карточек будут
                абсолютно такими же.
            -->

            <div
                class="categories-grid"
                id="categoriesContainer"
            ></div>

        </section>

    </main>


    <!-- =========================================================
         RESULT MODAL
    ========================================================== -->

    <div
        class="results-modal"
        id="resultModal"
    >

        <div
            class="results-modal-overlay"
            id="resultsModalOverlay"
        ></div>


        <div class="results-modal-content">

            <button
                class="results-modal-close"
                id="modalClose"
                type="button"
            >
                ×
            </button>


            <div class="results-modal-header">

                <div class="results-modal-label">
                    РЕЗУЛЬТАТЫ НОМИНАЦИИ
                </div>

                <h2
                    class="results-modal-title"
                    id="modalTitle"
                ></h2>

            </div>


            <div
                class="results-list"
                id="resultsList"
            ></div>

        </div>

    </div>


    <!-- =========================================================
         FOOTER
    ========================================================== -->

    <footer>

        <div class="footer-inner">

            <div>

                <strong>
                    БУЛДЖАТЬ AWARDS 2026
                </strong>

                <p>
                    Результаты голосования
                </p>

            </div>


            <div class="footer-links">

                <a
                    href="https://www.youtube.com/@buldjat"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    YouTube
                </a>

                <a
                    href="https://discord.com/invite/buldzhat-reborn-756512042827120641"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Discord
                </a>

                <a
                    href="https://t.me/buldj"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Telegram
                </a>

            </div>

        </div>

    </footer>


    <!-- =========================================================
         SUPABASE
    ========================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./results.js"></script>

</body>

</html>
